name: Matrix Testing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - "1.0"
          - "2.0"
          - "3.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test version
        run: |
          echo "Testing application version:"
          echo "${{ matrix.version }}"
          echo "Test completed successfully"
