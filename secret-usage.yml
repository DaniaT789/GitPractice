  secret-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Secret
        env:
          TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          echo "Secret is available"
          echo "Token length:"
          echo ${#TOKEN}

      - name: Complete
        run: echo "Secret workflow completed successfully"
